<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7FD1C1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바 트레이너">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>레시피 바 트레이너</title>
<style>
@font-face{font-family:"Jua";src:url("Jua-Regular.ttf") format("truetype");font-display:swap}
html{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;padding-top:max(14px,env(safe-area-inset-top,0px))}
/* Layout: sticker-cartoon cafe — scene (customer + speech-bubble order) → cup that fills layer by layer → ingredient sticker shelf.
   Deliberately single-theme: one bright cartoon world with explicit colors on every surface. */
:root{
  color-scheme:light;
  --ink:#1F1A2E; --ink-soft:#4B4560;
  --page:#7FD1C1; --dots:#6BC2B1;
  --panel:#FFFCF4; --panel-2:#FFF3D9;
  --wall:#CDEFF7; --counter:#F2A65A; --counter-dark:#D9853A;
  --accent:#FF6A4D; --accent-2:#FFC93C; --blue:#5B8CFF; --pink:#FF8FB8;
  --ok:#21A366; --mid:#F29D12; --bad:#E5484D;
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --line:3px solid var(--ink);
  --pop:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.45;
  background-color:var(--page);background-image:radial-gradient(var(--dots) 2.2px,transparent 2.6px);background-size:18px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 36px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.pop{background:var(--panel);border:var(--line);border-radius:18px;box-shadow:var(--pop)}
.press{transition:transform .08s,box-shadow .08s}
.press:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--panel);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);letter-spacing:.01em}
.logo span{color:var(--accent-2)}
.top-actions{display:flex;gap:8px}
.chipbtn{background:var(--panel);border:var(--line);border-radius:999px;padding:6px 12px;font-family:var(--f-display);font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--panel);border:var(--line);border-radius:14px;padding:3px;gap:3px;box-shadow:3px 3px 0 var(--ink)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:10px;font-family:var(--f-display);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{font-family:var(--f-display);font-size:15px;padding:7px 10px;border:var(--line);border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.hud{display:flex;gap:8px;margin-left:auto}
.badge{background:var(--accent-2);border:var(--line);border-radius:12px;padding:3px 10px;font-family:var(--f-display);font-size:15px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.t{background:var(--pink)}
.badge.t.low{background:var(--bad);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}

/* scene */
.scene{position:relative;overflow:hidden;padding:0;background:var(--wall)}
.scene-inner{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:end;gap:6px;padding:14px 14px 0;min-height:168px;position:relative;z-index:1}
.shelf{position:absolute;left:0;right:0;top:34px;height:10px;background:var(--counter-dark);border-block:var(--line);opacity:.55}
.window{position:absolute;right:16px;top:-3px;width:70px;height:28px;border:var(--line);border-top:0;border-radius:0 0 10px 10px;background:#fff;opacity:.6}
.counter{height:22px;background:var(--counter);border-top:var(--line);position:relative;z-index:2;background-image:repeating-linear-gradient(90deg,transparent 0 46px,var(--counter-dark) 46px 49px)}
.cust{width:128px;height:140px;align-self:end;margin-bottom:-6px}
.cust.in{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{from{transform:translateX(-120%) rotate(-12deg)}to{transform:none}}
.cust.happy{animation:jump .5s ease-out 2}
@keyframes jump{50%{transform:translateY(-14px)}}
.cust.mad{animation:shake .35s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{position:relative;align-self:center;margin-bottom:26px;background:#fff;border:var(--line);border-radius:20px;padding:10px 14px 12px;box-shadow:var(--pop);min-width:0}
.bubble::before{content:"";position:absolute;left:-16px;bottom:18px;border:10px solid transparent;border-right:16px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-9px;bottom:21px;border:7px solid transparent;border-right:11px solid #fff}
.b-no{font-size:11.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.04em}
.b-name{font-family:var(--f-display);font-size:27px;line-height:1.1;text-wrap:balance;word-break:keep-all}
.b-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-size:14px;padding:1px 9px;border:2.5px solid var(--ink);border-radius:999px}
.tag.ICE{background:#9FE3FF}.tag.HOT{background:#FF9E7A}
.b-meta{font-size:12px;color:var(--ink-soft);font-weight:700}
.patience{position:absolute;left:14px;right:14px;top:10px;height:10px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;z-index:3;overflow:hidden}
.patience i{display:block;height:100%;background:var(--ok);transition:width 1s linear,background .3s}

/* bar (cup + steps) */
.bar{padding:12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start;background:var(--panel)}
.cupwrap{position:relative}
.cupwrap svg{width:150px;height:auto;display:block;overflow:visible}
.newlayer{transform-box:fill-box;transform-origin:50% 100%;animation:pour .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pour{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.drop{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-120px)}to{transform:none}}
.steam path{animation:rise 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side-title{font-family:var(--f-display);font-size:16px;display:flex;justify-content:space-between}
.side-title span{color:var(--ink-soft);font-size:14px}
.steps{display:flex;flex-direction:column;gap:5px;counter-reset:s;max-height:208px;overflow:auto;padding-right:2px}
.empty{color:var(--ink-soft);font-size:13px;background:var(--panel-2);border:2px dashed var(--ink-soft);border-radius:12px;padding:10px}
.step{display:flex;align-items:center;gap:7px;border:2.5px solid var(--ink);background:#fff;border-radius:11px;padding:4px 4px 4px 6px;font-size:13.5px;font-weight:700;counter-increment:s;min-width:0}
.step::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center}
.step i{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);flex:none}
.step em{font-style:normal;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step button{border:0;background:transparent;font-size:18px;line-height:1;padding:0 4px;color:var(--ink-soft)}
.step.last{animation:pop .3s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.06)}100%{transform:none}}
.hint{font-size:13px;font-weight:700;background:var(--accent-2);border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.actions{display:grid;grid-template-columns:auto auto 1fr;gap:8px;grid-column:1/-1}
.btn{border:var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-family:var(--f-display);font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.btn.go{background:var(--accent);color:#fff;font-size:20px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* stations */
.stations{overflow:hidden}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 10px 0;scrollbar-width:none;border-bottom:var(--line);background:var(--panel-2)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:#fff;padding:6px 12px 5px;font-family:var(--f-display);font-size:15px;display:flex;gap:6px;align-items:center;margin-bottom:-3px;opacity:.75}
.tab i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.tab[aria-selected="true"]{opacity:1;background:var(--panel);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:14px 12px 16px}
.ing{border:var(--line);background:#fff;border-radius:16px;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;text-align:center;box-shadow:3px 3px 0 var(--ink);line-height:1.2;min-height:98px}
.ing svg{width:46px;height:46px}
.ing:hover svg{animation:wig .4s}
@keyframes wig{30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(31,26,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);border:var(--line);border-bottom:0;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
.sheet h2 svg{width:44px;height:44px}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 12px}
.amounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:9px}
.amt{border:var(--line);background:#fff;border-radius:14px;padding:11px 4px;font-family:var(--f-display);font-size:21px;box-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.amt:hover{background:var(--accent-2)}
.amt.skip{font-size:14px;background:var(--panel-2)}
.foot{display:flex;gap:8px;margin-top:16px}.foot .btn{flex:1}
.stamp{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.stamp b{font-family:var(--f-display);font-weight:400;font-size:30px;padding:4px 16px;border:4px solid currentColor;border-radius:14px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.stamp.good{color:var(--ok)}.stamp.mid{color:var(--mid)}.stamp.bad{color:var(--bad)}
.stamp span{font-family:var(--f-display);font-size:22px;color:var(--ink)}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;padding:7px 10px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-weight:700;font-size:14px}
.rlist li .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;border:2px solid var(--ink)}
.rlist li.ok .m{background:var(--ok)}
.rlist li.amt{background:#FFF1CF}.rlist li.amt .m{background:var(--mid)}
.rlist li.miss{background:#FFE0DF}.rlist li.miss .m{background:var(--bad)}
.rlist li.opt{opacity:.6}.rlist li.opt .m{background:var(--ink-soft)}
.rlist small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px}
.rhead{font-family:var(--f-display);font-size:16px;margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:700;padding:3px 9px;border:2px solid var(--ink);border-radius:999px;background:#FFE0DF}
.chip.n{background:#fff}
.note{font-size:13px;font-weight:700;background:var(--accent-2);border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;margin-top:12px}
.book h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:16px 0 6px}
.brow{padding:8px 10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:6px}
.brow .nm{font-family:var(--f-display);font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brow .rc{font-size:13px;color:var(--ink-soft)}
.pips{display:inline-flex;gap:3px}.pips i{width:10px;height:10px;border-radius:3px;border:2px solid var(--ink);background:#fff}.pips i.on{background:var(--ok)}
.meter{height:14px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.stat{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:3px 3px 0 var(--ink)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft);font-weight:700}
.fine{font-size:12px;color:var(--ink);text-align:center;opacity:.75}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);border-radius:3px;animation:fall 1.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (max-width:420px){
  .bar{grid-template-columns:120px minmax(0,1fr)}.cupwrap svg{width:120px}
  .scene-inner{grid-template-columns:100px minmax(0,1fr)}.cust{width:100px;height:112px}
  .b-name{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="logo">레시피 <span>바</span> 트레이너</div>
    <div class="top-actions">
      <button class="chipbtn press" id="bookBtn" type="button">레시피북</button>
      <button class="chipbtn press" id="statsBtn" type="button">오답노트</button>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="모드">
      <button type="button" id="modePractice" aria-pressed="true">연습</button>
      <button type="button" id="modeRush" aria-pressed="false">러시아워</button>
    </div>
    <select id="stage" aria-label="스테이지"></select>
    <div class="hud" id="hud"></div>
  </div>

  <section class="pop scene" aria-live="polite">
    <div class="shelf"></div><div class="window"></div>
    <div class="patience" id="patience" hidden><i></i></div>
    <div class="scene-inner">
      <div id="cust"></div>
      <div class="bubble" id="bubble"></div>
    </div>
    <div class="counter"></div>
  </section>

  <section class="pop bar" aria-label="내 컵">
    <div class="cupwrap" id="cup"></div>
    <div class="side">
      <div class="side-title">담은 순서 <span id="cupCount"></span></div>
      <div class="steps" id="steps"></div>
      <div class="hint" id="hintLine" hidden></div>
    </div>
    <div class="actions">
      <button class="btn press" id="undoBtn" type="button">되돌리기</button>
      <button class="btn press" id="hintBtn" type="button">힌트</button>
      <button class="btn go press" id="doneBtn" type="button">제조 완료!</button>
    </div>
  </section>

  <section class="pop stations" aria-label="재료 스테이션">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="fine">기록은 이 기기에만 저장됩니다 · 레시피 출처: 컴포즈커피 레시피 정리 1~10장</p>
</div>
<div id="layer"></div>
<div class="confetti" id="confetti"></div>

<script>
/* ---------- data ---------- */
const GROUPS=[
 {id:'syrup',n:'시럽',c:'#FFC93C'},{id:'sauce',n:'소스·베이스',c:'#B5743F'},{id:'liquid',n:'우유·물',c:'#7FC8FF'},
 {id:'powder',n:'파우더',c:'#E8D3A8'},{id:'fruit',n:'과일·청',c:'#FF9E5E'},{id:'tea',n:'티',c:'#B07A4A'},
 {id:'shot',n:'샷',c:'#5A2E17'},{id:'ice',n:'얼음·블렌더',c:'#9FE3FF'},{id:'top',n:'토핑',c:'#FF8FB8'}];
// k = icon kind, c = color in cup
const ING={
 van:{n:'바닐라시럽',g:'syrup',u:'P',k:'pump',c:'#F6E3A8'},haz:{n:'헤이즐넛시럽',g:'syrup',u:'P',k:'pump',c:'#C9935F'},
 sug:{n:'설탕시럽',g:'syrup',u:'P',k:'pump',c:'#F3F0E6'},lowsug:{n:'저당시럽',g:'syrup',u:'P',k:'pump',c:'#DDEFC8'},
 vanConc:{n:'바닐라시럽(고농축)',g:'syrup',u:'g',k:'pump',c:'#F2CF6E'},
 choco:{n:'초코소스',g:'sauce',u:'g',k:'squeeze',c:'#5A2F1E'},caramelS:{n:'카라멜소스',g:'sauce',u:'g',k:'squeeze',c:'#C9772C'},
 caramelB:{n:'카라멜베이스',g:'sauce',u:'g',k:'jar',c:'#DDA466'},dolceB:{n:'돌체베이스',g:'sauce',u:'g',k:'jar',c:'#EBCB9F'},
 condensed:{n:'연유',g:'sauce',u:'g',k:'squeeze',c:'#F7EACB'},brownS:{n:'흑당소스',g:'sauce',u:'g',k:'squeeze',c:'#4A2614',d:'흑당라떼류는 컵 벽에 둘러 묻히기'},honey:{n:'꿀',g:'sauce',u:'g',k:'honey',c:'#F4B225'},
 nuttyB:{n:'너티베이스',g:'sauce',u:'g',k:'jar',c:'#D3B28A'},pineB:{n:'파인애플베이스',g:'sauce',u:'g',k:'jar',c:'#F7D84E'},
 mixB:{n:'믹스커피베이스',g:'sauce',u:'g',k:'jar',c:'#C49466'},peachB:{n:'복숭아티베이스',g:'sauce',u:'g',k:'jar',c:'#F7A27C'},
 vanPowder:{n:'바닐라파우더',g:'powder',u:'g',k:'powder',c:'#F6E9C2'},
 milk:{n:'우유',g:'liquid',u:'ml',k:'carton',c:'#FFFFFF'},steam:{n:'스팀우유',g:'liquid',u:'ml',k:'pitcher',c:'#FBF5EA'},
 oat:{n:'오트우유',g:'liquid',u:'ml',k:'carton',c:'#EEDDBB'},
 hot:{n:'온수',g:'liquid',u:'ml',k:'kettle',c:'#CBEAF8'},purified:{n:'정수',g:'liquid',u:'ml',k:'drop',c:'#C6E8F9'},

/* ---------- cup renderer ---------- */
const CUP={top:36,bot:226,xl0:26,xr0:174,xl1:46,xr1:154}; // inner polygon
function cupX(y){const t=(y-CUP.top)/(CUP.bot-CUP.top);return [CUP.xl0+(CUP.xl1-CUP.xl0)*t,CUP.xr0+(CUP.xr1-CUP.xr0)*t]}
function hexMix(list){let r=0,g=0,b=0,w=0;list.forEach(([c,h])=>{const n=parseInt(c.slice(1),16);r+=(n>>16)*h;g+=((n>>8)&255)*h;b+=(n&255)*h;w+=h});
  if(!w)return '#fff';const f=x=>Math.round(x/w).toString(16).padStart(2,'0');return '#'+f(r)+f(g)+f(b)}
function vol(st){const g=ING[st.i];if(g.g==='shot')return g.v;if(g.g==='powder')return 12;if(g.g==='fruit'){if(g.k==='fruit'&&st.a==null)return 160;const n=parseFloat(st.a);return isNaN(n)?20:(g.u==='P'?n*10:n)}if(g.g==='syrup')return g.u==='P'?(+st.a||1)*10:(+st.a||5);
  if(g.g==='liquid')return st.a==null?150:+st.a;if(g.g==='sauce')return st.a==null?30:(parseFloat(st.a)||30);return 0}
function buildCup(steps,temp){
  // liquid layers
  let layers=[],tops=[],ice=0,brown=false,pearls=0,steamFx=false,frost=false;
  steps.forEach((st,idx)=>{const g=ING[st.i];
    if(st.i==='brownS'&&(+st.a||0)>=40){brown=true;layers.push({c:g.c,v:vol(st)*0.4,idx});return}
    if(st.i==='pearl'){pearls=Math.max(pearls,+st.a||40);return}
    if(st.i==='redBean'){tops.push({k:'bean',c:g.c,idx});return}
    if(g.g==='tea'){tops.push({k:'teabag',c:g.c,idx});return}
    if(['mix1','mix2','mix3','strain'].includes(st.i)){if(st.i!=='strain'){ice=0;frost=true}
      if(layers.length>1){const v=layers.reduce((a,l)=>a+l.v,0);layers=[{c:hexMix(layers.map(l=>[l.c,l.v])),v,idx,mixed:1}]}
      tops.push({k:'swirl',idx});return}
    if(st.i==='iceG'){ice=Math.max(ice,9);layers.push({c:'#F4FBFF',v:(parseFloat(st.a)||200)*0.45,idx});tops.push({k:'iceMark',idx});return}
    if(['syrup','sauce','liquid','shot','powder','fruit'].includes(g.g)&&!(g.g==='fruit'&&g.k==='cube')){layers.push({c:g.c,v:vol(st),idx,shot:g.g==='shot'});return}
    if(g.k==='ice'){ice=Math.max(ice,g.n2);tops.push({k:'iceMark',idx});return}
    if(st.i==='mix'||st.i==='whisk'||st.i==='steamAct'){
      if(st.i==='steamAct')steamFx=true;
      if(layers.length>1){const v=layers.reduce((a,l)=>a+l.v,0);layers=[{c:hexMix(layers.map(l=>[l.c,l.v])),v,idx,mixed:1}]}
      tops.push({k:'swirl',idx});return}
    tops.push({k:g.k,c:g.c,i:st.i,idx});
  });
  const total=layers.reduce((a,l)=>a+l.v,0);const cap=CUP.bot-CUP.top-14;
  const scale=Math.min(0.55,total?cap/total:0.55);
  let y=CUP.bot,svg='';const last=steps.length-1;
  const clip=`<clipPath id="cc"><path d="M${CUP.xl0} ${CUP.top} L${CUP.xr0} ${CUP.top} L${CUP.xr1} ${CUP.bot} Q100 ${CUP.bot+6} ${CUP.xl1} ${CUP.bot}z"/></clipPath>`;
  let liq='';
  layers.forEach(l=>{const h=Math.max(3,l.v*scale);const y0=y-h;
    const isNew=l.idx===last;
    liq+=`<g class="${isNew?'newlayer':''}"><rect x="0" y="${y0.toFixed(1)}" width="200" height="${(h+1).toFixed(1)}" fill="${l.c}"/>`+
      (l.shot?`<rect x="0" y="${y0.toFixed(1)}" width="200" height="4" fill="#C47A3A" opacity=".85"/>`:'')+
      `<path d="M0 ${y0.toFixed(1)}h200" stroke="#1F1A2E" stroke-width="1.2" opacity=".25"/></g>`;
    y=y0});
  const surf=y;
  // brown sugar streaks
  let walls='';
  if(brown){for(let i=0;i<9;i++){const x=34+i*16;walls+=`<path d="M${x} ${CUP.top+8} q${i%2?6:-6} 40 0 80 q${i%2?-5:5} 40 0 ${70+i%3*12}" fill="none" stroke="#4A2614" stroke-width="${4+i%3}" stroke-linecap="round" opacity=".75"/>`}}
  // pearls
  let pe='';if(pearls){for(let i=0;i<14;i++){const x=56+(i*23)%92,yy=CUP.bot-6-((i*7)%3)*9;pe+=`<circle cx="${x}" cy="${yy}" r="6" fill="#2A1A12" stroke="#1F1A2E" stroke-width="1.5"/><circle cx="${x-2}" cy="${yy-2}" r="1.6" fill="#fff" opacity=".8"/>`}}
  // frost (blended)
  let fr='';if(frost&&layers.length){for(let i=0;i<40;i++){const yy=surf+6+((i*37)%Math.max(10,CUP.bot-surf-10));fr+=`<circle cx="${30+(i*47)%140}" cy="${yy}" r="${1.5+(i%3)}" fill="#fff" opacity=".7"/>`}}
  // ice
  let ic='';if(ice){const lowY=Math.min(CUP.bot-20,Math.max(surf,CUP.top+40));const span=CUP.bot-30-(CUP.top+18);
    for(let i=0;i<ice;i++){const yy=CUP.top+22+((i*37)%Math.max(40,span));const [a,b]=cupX(yy);const x=a+10+((i*53)%Math.max(10,(b-a-40)));
      const iceNew=tops.some(t=>t.k==='iceMark'&&t.idx===last);
      ic+=`<g ${iceNew?`class="drop" style="animation-delay:${i*40}ms"`:''}><rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="26" height="24" rx="6" fill="#EAF9FF" fill-opacity=".72" stroke="#1F1A2E" stroke-width="2" transform="rotate(${(i*29)%40-20} ${x+13} ${yy+12})"/></g>`}}
  // toppings above surface
  let tp='';let ty=Math.min(surf,CUP.bot-4);
  const isNew=t=>t.idx===last;
  tops.forEach(t=>{
    if(t.k==='swirl'&&isNew(t)){tp+=`<path class="drop" d="M70 ${ty-30} q30 -20 60 0 q-30 20 -60 0" fill="none" stroke="#FF6A4D" stroke-width="4" stroke-linecap="round"/>`}
    if(t.k==='teabag'){tp+=`<g class="${isNew(t)?'drop':''}"><path d="M150 ${CUP.top-6} q10 20 -8 60" fill="none" stroke="#1F1A2E" stroke-width="2"/><rect x="128" y="${CUP.top+50}" width="26" height="30" rx="4" fill="${t.c}" stroke="#1F1A2E" stroke-width="2.5"/><rect x="160" y="${CUP.top-20}" width="16" height="12" rx="2" fill="#FFC93C" stroke="#1F1A2E" stroke-width="2.5"/></g>`}
    if(t.k==='fruit'||t.k==='jar'||t.k==='can'||t.k==='pump'){}
    if(t.k==='squeeze'){tp+=`<path d="M40 ${CUP.top+20} q60 30 120 0" fill="none" stroke="${t.c}" stroke-width="6" stroke-linecap="round" opacity=".85"/>`}
    if(t.k==='cream'){const [a,b]=cupX(Math.max(ty,CUP.top+4));
      tp+=`<g class="${isNew(t)?'drop':''}"><path d="M${a-2} ${ty} c0-22 18-26 26-24 c4-16 18-24 26-28 c8 4 22 12 26 28 c8-2 26 2 26 24z" fill="${t.c}" stroke="#1F1A2E" stroke-width="3" stroke-linejoin="round"/></g>`;ty-=34}
    if(t.k==='scoop'){tp+=`<g class="${isNew(t)?'drop':''}"><circle cx="100" cy="${ty-16}" r="26" fill="${t.c}" stroke="#1F1A2E" stroke-width="3"/><circle cx="90" cy="${ty-24}" r="3" fill="#FF8FB8"/><circle cx="110" cy="${ty-12}" r="3" fill="#7FC8FF"/></g>`;ty-=36}
    if(t.k==='drizzle'){tp+=`<path class="${isNew(t)?'drop':''}" d="M52 ${ty-4} l12 -10 12 10 12 -10 12 10 12 -10 12 10 12 -10" fill="none" stroke="${t.c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}
    if(t.k==='powder'){let d='';for(let i=0;i<16;i++){d+=`<circle cx="${62+(i*29)%76}" cy="${ty-6-(i*13)%18}" r="2.4" fill="${t.c}"/>`}tp+=`<g class="${isNew(t)?'drop':''}">${d}</g>`}
    if(t.k==='dalgona'){let d='';for(let i=0;i<6;i++){d+=`<path d="M${60+i*14} ${ty-4-(i%2)*8} l8 -4 6 6 -6 6 -8 -2z" fill="#E09B2D" stroke="#1F1A2E" stroke-width="2"/>`}tp+=`<g class="${isNew(t)?'drop':''}">${d}</g>`}
    if(t.k==='bean'){let d='';for(let i=0;i<7;i++){d+=`<ellipse cx="${66+(i*11)}" cy="${ty-6-(i%2)*7}" rx="7" ry="5" fill="${t.c}" stroke="#1F1A2E" stroke-width="1.8"/>`}tp+=`<g class="${isNew(t)?'drop':''}">${d}</g>`;ty-=6}
    if(t.k==='cube'){let d='';for(let i=0;i<5;i++){d+=`<rect x="${60+i*16}" y="${ty-12-(i%2)*8}" width="14" height="14" rx="3" fill="${t.c||'#FFC23D'}" stroke="#1F1A2E" stroke-width="2"/>`}tp+=`<g class="${isNew(t)?'drop':''}">${d}</g>`}
  });
  const hot=temp==='HOT';
  const steamPaths=(hot||steamFx)&&layers.length?`<g class="steam" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M70 22c-8-10 8-14 0-24"/><path d="M100 18c-8-10 8-14 0-24"/><path d="M130 22c-8-10 8-14 0-24"/></g>`:'';
  const sleeve=hot?`<path d="M${cupX(120)[0]-2} 120 L${cupX(120)[1]+2} 120 L${cupX(168)[1]+2} 168 L${cupX(168)[0]-2} 168z" fill="#E7B67A" stroke="#1F1A2E" stroke-width="3" opacity=".92"/><text x="100" y="150" text-anchor="middle" font-family="Jua,sans-serif" font-size="18" fill="#1F1A2E">HOT</text>`:'';
  return `<svg viewBox="-6 -10 212 252" role="img" aria-label="컵에 담긴 재료 ${steps.length}단계">
    <defs>${clip}</defs>
    <ellipse cx="100" cy="236" rx="70" ry="6" fill="#1F1A2E" opacity=".18"/>
    ${steamPaths}
    <path d="M${CUP.xl0} ${CUP.top} L${CUP.xr0} ${CUP.top} L${CUP.xr1} ${CUP.bot} Q100 ${CUP.bot+6} ${CUP.xl1} ${CUP.bot}z" fill="${hot?'#FFF6EA':'#EEF9FF'}"/>
    <g clip-path="url(#cc)">${liq}${fr}${walls}${pe}${ic}</g>
    <path d="M${CUP.xl0+12} ${CUP.top+16} L${CUP.xl1+8} ${CUP.bot-16}" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <path d="M${CUP.xl0} ${CUP.top} L${CUP.xr0} ${CUP.top} L${CUP.xr1} ${CUP.bot} Q100 ${CUP.bot+6} ${CUP.xl1} ${CUP.bot}z" fill="none" stroke="#1F1A2E" stroke-width="4" stroke-linejoin="round"/>
    <rect x="${CUP.xl0-6}" y="${CUP.top-8}" width="${CUP.xr0-CUP.xl0+12}" height="10" rx="5" fill="#fff" stroke="#1F1A2E" stroke-width="3.5"/>
    ${sleeve}${tp}
  </svg>`;
}

const store=Object.assign({cards:{},best:0,stage:'1'},load());
function card(k){return store.cards[k]||(store.cards[k]={box:1,seen:0,perfect:0,miss:0,last:0})}

/* ---------- state ---------- */
const S={mode:'practice',stage:String(store.stage||'1'),cur:null,cup:[],hint:false,tab:'syrup',
  rush:{on:false,left:0,score:0,combo:0,made:0,perfect:0,timer:null},streak:0,lastKey:null,no:0,cust:{color:'#FF8FB8',ears:0},mood:'wait'};
const RUSH_SEC=90;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(st){const g=ING[st.i];if(st.a==null||st.a==='')return g.n;return g.n+' '+st.a+(g.u==='P'&&!isNaN(+st.a)?'P':'')}
const gcol=g=>GROUPS.find(x=>x.id===g).c;
function pool(){return S.stage==='all'?RECIPES:RECIPES.filter(r=>String(r.ch)===S.stage)}
function pickNext(){const p=pool();let tot=0;
  const w=p.map(r=>{let x=6-card(r.key).box;if(r.key===S.lastKey&&p.length>1)x=0;tot+=x;return x});
  let t=Math.random()*tot;for(let i=0;i<p.length;i++){t-=w[i];if(t<=0)return p[i]}return p[p.length-1]}
function newTicket(){
  S.cur=pickNext();S.lastKey=S.cur.key;S.cup=[];S.hint=false;S.no++;S.mood='wait';
  S.cust={color:CUST_COLORS[Math.floor(Math.random()*CUST_COLORS.length)],ears:Math.floor(Math.random()*3)};
  renderScene('in');renderCup();
}

/* ---------- grading ---------- */
function grade(R,U){
  const used=new Set(),match=R.steps.map(()=>-1);
  R.steps.forEach((r,ri)=>{for(let u=0;u<U.length;u++){if(!used.has(u)&&U[u].i===r.i){match[ri]=u;used.add(u);break}}});
  const missing=[],amt=[],rows=[];
  R.steps.forEach((r,ri)=>{const m=match[ri];
    if(m<0){rows.push({st:r.opt?'opt':'miss',r});if(!r.opt)missing.push(ri);return}
    if(r.a!=null&&String(U[m].a)!==String(r.a)){amt.push(ri);rows.push({st:'amt',r,u:U[m]});return}
    rows.push({st:'ok',r})});
  const extra=U.map((u,i)=>i).filter(i=>!used.has(i));
  const seq=match.filter(m=>m>=0);let orderOk=true;for(let i=1;i<seq.length;i++)if(seq[i]<seq[i-1]){orderOk=false;break}
  const perfect=!missing.length&&!amt.length&&!extra.length&&orderOk;
  const score=Math.max(0,100-25*missing.length-15*extra.length-15*amt.length-(orderOk?0:10));
  return {missing,amt,extra,orderOk,perfect,score,rows};
}

function confetti(){const box=$('confetti');const cols=['#FF6A4D','#FFC93C','#7FC8FF','#8BE38B','#FF8FB8','#C9A7FF'];
  box.innerHTML=Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.3}s;animation-duration:${1+Math.random()*.8}s"></i>`).join('');
  setTimeout(()=>box.innerHTML='',2200)}
function submit(){
  if(!S.cur)return;
  const res=grade(S.cur,S.cup),c=card(S.cur.key);
  c.seen++;c.last=Date.now();
  if(res.perfect&&!S.hint){c.box=Math.min(5,c.box+1);c.perfect++}else if(!res.perfect){c.box=1;c.miss++}
  if(S.mode==='rush'){S.rush.made++;if(res.perfect){S.rush.perfect++;S.rush.score+=100+S.rush.combo*20;S.rush.combo++}else S.rush.combo=0}
  else S.streak=res.perfect?S.streak+1:0;
  save();
  S.mood=res.perfect?'happy':res.score>=60?'mid':'bad';
  renderScene(res.perfect?'happy':S.mood==='bad'?'mad':null);renderHud();
  if(res.perfect)confetti();
  setTimeout(()=>showResult(res),res.perfect?550:400);
}
function showResult(res){

    if(x.st==='amt')return `<li class="amt"><span class="m">!</span><span>${esc(fmt(x.r))}<small>내가 넣은 양: ${esc(fmt(x.u))}</small></span></li>`;
    if(x.st==='opt')return `<li class="opt"><span class="m">–</span><span>${esc(fmt(x.r))}<small>선택 사항</small></span></li>`;
    return `<li class="miss"><span class="m">✗</span><span>${esc(fmt(x.r))}<small>빠뜨렸어요</small></span></li>`}).join('');
  const extra=res.extra.length?`<div class="rhead">레시피에 없는 재료</div><div class="chips">${res.extra.map(i=>`<span class="chip">${esc(fmt(S.cup[i]))}</span>`).join('')}</div>`:'';
  const order=!res.orderOk?`<div class="rhead">순서가 달라요 · 내가 담은 순서</div><div class="chips">${S.cup.map((s,i)=>`<span class="chip n">${i+1}. ${esc(fmt(s))}</span>`).join('')}</div>`:'';
  const note=S.cur.note?`<div class="note">📌 ${esc(S.cur.note)}</div>`:'';

    <p class="sub">${esc(S.cur.name)} ${S.cur.temp} · 정답 레시피 순서</p>
    <ol class="rlist">${rows}</ol>${extra}${order}${note}
    <div class="foot">${!res.perfect&&S.mode==='practice'?'<button class="btn press" type="button" data-retry>같은 메뉴 다시</button>':''}<button class="btn go press" type="button" data-next>다음 손님</button></div>`,e=>{
      if(e.target.closest('[data-next]')){closeSheet();if(S.mode==='rush'&&!S.rush.on)return;newTicket()}
      else if(e.target.closest('[data-retry]')){closeSheet();S.cup=[];S.hint=false;S.mood='wait';renderScene();renderCup()}});

function openStats(){
  const all=RECIPES.map(r=>({r,c:card(r.key)}));const seen=all.filter(x=>x.c.seen>0);
  const tot=seen.reduce((a,x)=>a+x.c.seen,0),perf=seen.reduce((a,x)=>a+x.c.perfect,0);
  const worst=seen.filter(x=>x.c.miss>0).sort((a,b)=>b.c.miss-a.c.miss||a.c.box-b.c.box).slice(0,10);
  const chBars=CH_IDS.map(ch=>{const p=RECIPES.filter(r=>r.ch===ch);const m=p.filter(r=>card(r.key).box>=3).length;
    return `<div class="brow"><div class="nm">${esc(CHAPTERS[ch])} <span class="rc">${m}/${p.length} 익힘</span></div><div class="meter"><i style="width:${Math.round(100*m/p.length)}%"></i></div></div>`}).join('');
  openSheet(`<h2>📝 오답노트</h2><p class="sub">숙련 3/5 이상이면 익힌 메뉴예요. 틀리면 1로 돌아가요.</p>
    <div class="stats"><div class="stat"><b>${tot}</b><span>만든 잔</span></div><div class="stat"><b>${tot?Math.round(100*perf/tot):0}%</b><span>완벽률</span></div><div class="stat"><b>${store.best||0}</b><span>러시 최고점</span></div></div>
    ${chBars}<div class="rhead">자주 틀린 메뉴 TOP 10</div>
    ${worst.length?worst.map(x=>`<div class="brow"><div class="nm">${esc(x.r.name)} <span class="tag ${x.r.temp}">${x.r.temp}</span><span class="rc">틀림 ${x.c.miss} · 숙련 ${x.c.box}/5</span></div><div class="rc">${x.r.steps.map(s=>esc(fmt(s))).join(' → ')}</div></div>`).join(''):'<p class="sub">아직 틀린 메뉴가 없어요.</p>'}
    <div class="foot"><button class="btn press" type="button" data-reset>기록 초기화</button><button class="btn go press" type="button" data-close>닫기</button></div>`,e=>{
      if(e.target.closest('[data-close]'))closeSheet();
      else if(e.target.closest('[data-reset]')){const b=e.target.closest('[data-reset]');
        if(b.dataset.armed){store.cards={};store.best=0;save();closeSheet();S.streak=0;renderHud();renderScene()}
        else{b.dataset.armed='1';b.textContent='한 번 더 누르면 초기화'}}});
}

/* ---------- rush ---------- */
function startRush(){clearInterval(S.rush.timer);Object.assign(S.rush,{on:true,left:RUSH_SEC,score:0,combo:0,made:0,perfect:0});newTicket();
  S.rush.timer=setInterval(()=>{S.rush.left--;renderHud();if(S.rush.left<=0)endRush()},1000)}
function endRush(){clearInterval(S.rush.timer);S.rush.on=false;
  const best=S.rush.score>(store.best||0);if(best){store.best=S.rush.score;save();confetti()}
  openSheet(`<div class="stamp good"><b>마감!</b><span>${S.rush.score}점</span></div>
    <div class="stats"><div class="stat"><b>${S.rush.made}</b><span>만든 잔</span></div><div class="stat"><b>${S.rush.perfect}</b><span>완벽</span></div><div class="stat"><b>${store.best}</b><span>${best?'🎉 새 최고점':'최고점'}</span></div></div>
    <div class="foot"><button class="btn press" type="button" data-practice>연습으로</button><button class="btn go press" type="button" data-again>한 판 더</button></div>`,e=>{
      if(e.target.closest('[data-again]')){closeSheet();startRush()}else if(e.target.closest('[data-practice]')){closeSheet();setMode('practice')}})}
function setMode(m){S.mode=m;$('modePractice').setAttribute('aria-pressed',m==='practice');$('modeRush').setAttribute('aria-pressed',m==='rush');
  clearInterval(S.rush.timer);S.rush.on=false;if(m==='rush')startRush();else newTicket()}

/* ---------- events ---------- */
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-ing]');if(!b)return;const id=b.dataset.ing;
  if(ING[id].u)askAmount(id);else{S.cup.push({i:id,a:null});renderCup()}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;renderTabs()});
$('steps').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;S.cup.splice(+b.dataset.rm,1);renderCup()});
$('undoBtn').addEventListener('click',()=>{S.cup.pop();renderCup()});
$('hintBtn').addEventListener('click',()=>{S.hint=true;renderCup()});
$('doneBtn').addEventListener('click',submit);
$('modePractice').addEventListener('click',()=>setMode('practice'));
$('modeRush').addEventListener('click',()=>setMode('rush'));
$('stage').addEventListener('change',e=>{S.stage=e.target.value;store.stage=S.stage;save();setMode(S.mode)});
$('bookBtn').addEventListener('click',openBook);
$('statsBtn').addEventListener('click',openStats);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('layer').innerHTML)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(S.mode!=='rush'||!S.rush.on)return;
  if(document.hidden)clearInterval(S.rush.timer);else{clearInterval(S.rush.timer);S.rush.timer=setInterval(()=>{S.rush.left--;renderHud();if(S.rush.left<=0)endRush()},1000)}});
renderStageSel();renderTabs();newTicket();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
